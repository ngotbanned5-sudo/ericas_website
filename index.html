<!DOCTYPE html>
<html lang="en">
<head><meta name="google-site-verification" content="3y_qZEvvI--wugP-UTrOuRMPETlAPSCgXIVOM-5az20" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Erica's Website</title>
<meta name="description" content="Welcome to Erica's website — a cute black and pink cheetah print space.">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: #171717;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 18% 20%, rgba(255,255,255,.75) 0 5px, transparent 6px),
      radial-gradient(ellipse at 70% 35%, #171717 0 13px, transparent 14px),
      radial-gradient(ellipse at 42% 72%, #171717 0 10px, transparent 11px),
      radial-gradient(ellipse at 82% 78%, #171717 0 16px, transparent 17px),
      #f7a8c7;
    background-size: 110px 100px, 150px 120px, 125px 145px, 170px 135px, auto;
    overflow: hidden;
  }
  .card {
    width: min(900px, 90vw);
    padding: 70px 35px;
    text-align: center;
    background: rgba(255, 240, 246, .94);
    border: 5px solid #171717;
    border-radius: 28px;
    box-shadow: 14px 14px 0 #171717;
  }
  .mini { font: bold 15px Arial, sans-serif; letter-spacing: 5px; text-transform: uppercase; }
  h1 {
    margin: 18px 0 12px;
    font-size: clamp(48px, 9vw, 100px);
    line-height: .9;
    text-transform: uppercase;
  }
  h1 span { display: block; }
  .name { font-style: italic; }
  p { font: 18px Arial, sans-serif; margin: 24px auto 0; max-width: 560px; }
  .paw { font-size: 38px; margin-top: 28px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mini">♡ welcome ♡</div>
    <h1><span>Welcome to</span><span class="name">Erica's Website</span></h1>
    <p>A little corner of the internet made by Erica.</p>
    <div class="paw">🐆 ♡ 🐆</div>
  </main>
</body>
</html>
